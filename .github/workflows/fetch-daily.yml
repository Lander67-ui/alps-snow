name: Fetch Daily Snow Data

# Runs every morning at 6:00 AM Paris time (5:00 UTC in winter, 4:00 UTC in summer).
# Fetches fresh weather data for all 10 resorts, commits the new score file,
# and pushes to main — which triggers a Vercel redeploy automatically.
on:
  schedule:
    - cron: "0 5 * * *"   # 6:00 AM Paris (winter, UTC+1)
    - cron: "0 4 * * *"   # 6:00 AM Paris (summer, UTC+2)
  workflow_dispatch:       # allow manual trigger from GitHub Actions UI

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push the updated data file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch snow data
        run: npm run fetch-data

      - name: Check if data changed
        id: check
        run: |
          git diff --quiet data/scores/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated scores
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "Alps Snow Bot"
          git config user.email "bot@alps-snow.com"
          git add data/scores/
          git commit -m "chore: daily snow data update $(date -u +'%Y-%m-%d')"
          git push
